{% extends 'crm/base.html' %}

{% block title %}Удалить заказ - CRM{% endblock %}

{% block content %}
<div class="container-fluid p-4">
    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card border-0 shadow-sm">
                <div class="card-body text-center">
                    <i class="bi bi-exclamation-triangle text-warning fs-1"></i>
                    <h4 class="mt-3">Удалить заказ?</h4>
                    <p class="text-muted">Вы уверены, что хотите удалить заказ <strong>#{{ object.pk }}</strong>?</p>
                    <p class="text-danger small">Товары будут возвращены на склад.</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Да, удалить</button>
                        <a href="{% url 'order_list' %}" class="btn btn-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
